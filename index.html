<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calendario de Medicamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A4A;
    --bg-2: #16213A;
    --paper: #FBF6EC;
    --paper-shadow: #E8DFCB;
    --ink: #23273A;
    --ink-soft: #565C72;
    --gold: #C9974C;
    --brick: #B5453E;
    --sage: #4C7A5A;
    --sage-bg: #E4EEE3;
    --muted: #A9A28E;
    --ring: #16213A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at top, var(--bg) 0%, var(--bg-2) 100%);
    font-family: 'Public Sans', -apple-system, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  .board {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(10px, 2vh, 28px) clamp(12px, 3vw, 40px);
  }

  /* ---------- Hoja de calendario ---------- */
  .sheet {
    background: var(--paper);
    border-radius: 22px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.03);
    width: 100%;
    max-width: 1400px;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: clamp(20px, 3vh, 34px);
    overflow: hidden;
  }

  .rings {
    position: absolute;
    top: -14px; left: 0; right: 0;
    display: flex;
    justify-content: space-evenly;
    padding: 0 6%;
  }
  .rings span {
    width: clamp(16px, 2vw, 26px);
    height: clamp(16px, 2vw, 26px);
    border-radius: 50%;
    background: var(--ring);
    box-shadow: inset 0 3px 4px rgba(0,0,0,0.4);
  }

  /* ---------- Encabezado: día + fecha + reloj ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(20px, 4vw, 56px) clamp(10px, 2vh, 20px);
    border-bottom: 2px dashed var(--paper-shadow);
    flex-shrink: 0;
  }

  .day-block { display: flex; align-items: baseline; gap: clamp(16px, 3vw, 34px); }

  .day-name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    color: var(--ink);
    line-height: 0.95;
    text-transform: capitalize;
    letter-spacing: -0.01em;
  }

  .date-num {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(3rem, 8vw, 6rem);
    color: var(--brick);
    line-height: 0.9;
  }

  .month-year {
    font-size: clamp(1rem, 2vw, 1.5rem);
    color: var(--ink-soft);
    font-weight: 600;
    text-transform: capitalize;
  }

  .clock {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.8rem, 4vw, 3.2rem);
    color: var(--ink);
    background: var(--sage-bg);
    padding: 0.3em 0.6em;
    border-radius: 14px;
    white-space: nowrap;
  }

  /* ---------- Tira semanal ---------- */
  .week-strip {
    display: flex;
    justify-content: space-between;
    gap: clamp(6px, 1vw, 14px);
    padding: clamp(14px, 2.2vh, 22px) clamp(20px, 4vw, 56px);
    flex-shrink: 0;
  }
  .day-chip {
    flex: 1;
    text-align: center;
    padding: clamp(8px, 1.2vh, 14px) 4px;
    border-radius: 14px;
    font-weight: 700;
    font-size: clamp(0.85rem, 1.6vw, 1.3rem);
    color: var(--ink-soft);
    text-transform: capitalize;
    border: 2px solid transparent;
  }
  .day-chip.today {
    background: var(--brick);
    color: white;
    box-shadow: 0 6px 14px -6px rgba(181,69,62,0.6);
  }

  /* ---------- Lista de medicamentos ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 clamp(20px, 4vw, 56px) clamp(20px, 3vh, 30px);
  }

  .section-label {
    font-size: clamp(0.95rem, 1.8vw, 1.3rem);
    font-weight: 800;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: clamp(10px, 1.6vh, 18px) 0 clamp(8px, 1.2vh, 12px);
  }

  .med-list { display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px); }

  .med-row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.6vw, 18px);
    background: white;
    border: 2px solid var(--paper-shadow);
    border-radius: 16px;
    padding: clamp(8px, 1.1vh, 12px) clamp(12px, 1.8vw, 18px);
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  .med-row.taken { background: var(--sage-bg); border-color: var(--sage); }

  .divisor-hora {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.6vw, 16px);
    margin: clamp(14px, 2vh, 20px) 0 clamp(4px, 0.6vh, 8px);
  }
  .divisor-hora:first-child { margin-top: 0; }
  .divisor-hora .hora-texto {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(1rem, 1.9vw, 1.4rem);
    color: var(--gold);
    white-space: nowrap;
  }
  .divisor-hora .linea {
    flex: 1;
    height: 2px;
    background: var(--paper-shadow);
  }

  .med-info { flex: 1; }
  .med-name {
    font-size: clamp(0.95rem, 1.7vw, 1.3rem);
    font-weight: 700;
    color: var(--ink);
  }
  .med-apodo {
    font-weight: 500;
    font-style: italic;
    color: var(--ink-soft);
  }
  .med-dose {
    font-size: clamp(0.8rem, 1.3vw, 1rem);
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .badge {
    font-size: clamp(0.7rem, 1.2vw, 0.9rem);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.35em 0.7em;
    border-radius: 999px;
    background: var(--gold);
    color: white;
    white-space: nowrap;
  }
  .badge.hoy { background: var(--brick); }

  .check-btn {
    flex-shrink: 0;
    width: clamp(36px, 4.5vw, 48px);
    height: clamp(36px, 4.5vw, 48px);
    border-radius: 50%;
    border: 3px solid var(--paper-shadow);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .med-row.taken .check-btn { background: var(--sage); border-color: var(--sage); }
  .check-btn svg { width: 55%; height: 55%; stroke: white; stroke-width: 3.5; fill: none; opacity: 0; transition: opacity 0.15s; }
  .med-row.taken .check-btn svg { opacity: 1; }

  .no-hoy {
    opacity: 0.55;
  }
  .no-hoy .med-name { color: var(--muted); }
  .no-hoy .check-btn { display: none; }

  .empty-note {
    color: var(--ink-soft);
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    padding: 10px 4px 20px;
  }

  .aviso-especial {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.8vw, 18px);
    padding: clamp(12px, 1.8vh, 18px) clamp(16px, 2.4vw, 26px);
    border-radius: 16px;
    margin: clamp(10px, 1.6vh, 16px) 0;
    font-weight: 700;
  }
  .aviso-especial .icono { font-size: clamp(1.6rem, 3vw, 2.3rem); flex-shrink: 0; }
  .aviso-especial .texto { font-size: clamp(1.1rem, 2.1vw, 1.6rem); }
  .aviso-especial .texto small { display: block; font-weight: 500; font-size: 0.7em; margin-top: 2px; }

  .aviso-especial.si-toca {
    background: var(--brick);
    color: white;
  }
  .aviso-especial.no-toca {
    background: var(--sage-bg);
    border: 2px solid var(--sage);
    color: var(--ink);
  }
</style>
</head>
<body>

<div class="board">
  <div class="sheet">
    <div class="rings">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <header>
      <div class="day-block">
        <div>
          <div class="day-name" id="dayName">jueves</div>
          <div class="month-year" id="monthYear">agosto 2026</div>
        </div>
        <div class="date-num" id="dateNum">6</div>
      </div>
      <div class="clock" id="clock">10:32</div>
    </header>

    <div class="week-strip" id="weekStrip"></div>

    <main>
      <div id="avisoEspecial"></div>

      <div class="section-label">Hoy toca</div>
      <div class="med-list" id="listHoy"></div>

      <div class="section-label">Hoy NO toca</div>
      <div class="med-list" id="listNoHoy"></div>
    </main>
  </div>
</div>

<script>
/* =========================================================================
   CÓMO EDITAR LA LISTA DE MEDICAMENTOS
   -------------------------------------------------------------------------
   Cambia los datos aquí abajo. Cada medicamento tiene:
     nombre:      texto que se muestra (ej. "Losartán")
     apodo:       (opcional) como le dicen coloquialmente, se muestra entre
                  paréntesis junto al nombre (ej. "la de la presión").
                  Si un medicamento no tiene apodo, simplemente no le pongas
                  este campo, o bórralo.
     dosis:       texto pequeño debajo del nombre (ej. "50 mg, 1 tableta")
     hora:        hora en formato 24h "HH:MM" (esto es solo para que la lista
                  se ordene bien). En la pantalla se muestra automáticamente
                  en formato de 12 horas con a.m./p.m., ej. "07:00" -> "7:00 a.m."
                  y "19:00" -> "7:00 p.m."
     frecuencia:  "diario"  -> se muestra todos los días
                  "semanal" -> se muestra solo en los días indicados en "dias"
                               (0=domingo, 1=lunes, 2=martes, 3=miércoles,
                                4=jueves, 5=viernes, 6=sábado)
                  "mensual" -> se muestra solo en el día del mes indicado en
                               "diaDelMes" (número del 1 al 31)
   ========================================================================= */
const MEDICAMENTOS = [
  { nombre: "Levotiroxina",   apodo: "Tiroides",   dosis: "1 tableta",     hora: "06:00", frecuencia: "diario" },
  { nombre: "Omeprazol",      apodo: "Proton",              dosis: "1 tableta",     hora: "06:00", frecuencia: "diario" },
  { nombre: "Carvedilol",     apodo: "Corazón",             dosis: "1/2 tableta",   hora: "06:00", frecuencia: "diario" },
  { nombre: "Loperamida",     apodo: "Antidiarreico",       dosis: "2 tabletas",    hora: "06:00", frecuencia: "diario" },
  { nombre: "Vitamina D",                                   dosis: "10 gotas",      hora: "08:00", frecuencia: "diario" },
  { nombre: "Ácido fólico",                                 dosis: "1 tableta",     hora: "09:00", frecuencia: "semanal", dias: [0,1,2,4,5,6] }, // todos excepto miércoles
  { nombre: "Prednisolona",                                 dosis: "5 tabletas",    hora: "09:00", frecuencia: "diario" },
  { nombre: "Hierro",                                       dosis: "2 tabletas",    hora: "09:00", frecuencia: "diario" },
  { nombre: "Venlafaxina",    apodo: "Paliativos",          dosis: "1 cápsula",     hora: "09:00", frecuencia: "diario" },
  { nombre: "Metotrexato",                                  dosis: "6 tabletas",    hora: "10:00", frecuencia: "semanal", dias: [3], especial: true }, // solo miércoles
  { nombre: "Colestiramina",  apodo: "Polvillo",            dosis: "1 sobre",       hora: "10:00", frecuencia: "diario" },
  { nombre: "Trimetoprima",                                 dosis: "1 tableta",     hora: "16:00", frecuencia: "semanal", dias: [1,3,5] },    // lun, mié, vie
  { nombre: "Colestiramina",  apodo: "Polvillo",            dosis: "1 sobre",       hora: "17:00", frecuencia: "diario" },
  { nombre: "Carvedilol",     apodo: "Corazón",             dosis: "1/2 tableta",   hora: "18:00", frecuencia: "diario" },
  { nombre: "Omeprazol",      apodo: "Proton",              dosis: "1 tableta",     hora: "18:00", frecuencia: "diario" },
  { nombre: "Loperamida",     apodo: "Antidiarreico",       dosis: "2 tabletas",    hora: "18:00", frecuencia: "diario" },
  { nombre: "Defenhidramina", apodo: "Dormir",              dosis: "2 tabletas",    hora: "22:00", frecuencia: "diario" },
  { nombre: "Clonazepam",     apodo: "Dormir",              dosis: "20 gotas",      hora: "22:00", frecuencia: "diario" },
];

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_CORTOS = ["D","L","M","M","J","V","S"];

let tomados = new Set(); // se reinicia solo (memoria), y se limpia si cambia el día
let ultimoDiaRenderizado = null;

function formatoHora12(hora24) {
  const [h, m] = hora24.split(":").map(Number);
  const periodo = h < 12 ? "a.m." : "p.m.";
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2, "0")} ${periodo}`;
}

function medAplicaHoy(med, fecha) {
  const diaSemana = fecha.getDay();
  const diaMes = fecha.getDate();
  if (med.frecuencia === "diario") return true;
  if (med.frecuencia === "semanal") return med.dias.includes(diaSemana);
  if (med.frecuencia === "mensual") return med.diaDelMes === diaMes;
  return false;
}

function crearFila(med, esHoy, index) {
  const row = document.createElement("div");
  row.className = "med-row" + (esHoy ? "" : " no-hoy");
  const key = med.nombre + med.hora + index;
  if (tomados.has(key)) row.classList.add("taken");

  const badgeTexto = med.frecuencia === "diario" ? "Diario" : med.frecuencia === "semanal" ? "Semanal" : "Mensual";

  row.innerHTML = `
    <div class="med-info">
      <div class="med-name">${med.nombre}${med.apodo ? ` <span class="med-apodo">(${med.apodo})</span>` : ""}</div>
      <div class="med-dose">${med.dosis}</div>
    </div>
    ${esHoy ? `<span class="badge hoy">Hoy</span>` : `<span class="badge">${badgeTexto}</span>`}
    <div class="check-btn">
      <svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>
    </div>
  `;

  if (esHoy) {
    row.querySelector(".check-btn").addEventListener("click", () => {
      row.classList.toggle("taken");
      if (row.classList.contains("taken")) tomados.add(key); else tomados.delete(key);
    });
  }
  return row;
}

function crearDivisorHora(hora24) {
  const divisor = document.createElement("div");
  divisor.className = "divisor-hora";
  divisor.innerHTML = `<span class="hora-texto">${formatoHora12(hora24)}</span><span class="linea"></span>`;
  return divisor;
}

function render() {
  const ahora = new Date();
  const hoyStr = ahora.toDateString();
  if (ultimoDiaRenderizado !== hoyStr) {
    tomados.clear(); // nuevo día: limpiar marcas de "tomado"
    ultimoDiaRenderizado = hoyStr;
  }

  document.getElementById("dayName").textContent = DIAS[ahora.getDay()];
  document.getElementById("dateNum").textContent = ahora.getDate();
  document.getElementById("monthYear").textContent = `${MESES[ahora.getMonth()]} ${ahora.getFullYear()}`;
  document.getElementById("clock").textContent = ahora.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', hour12: true });

  // Tira semanal
  const weekStrip = document.getElementById("weekStrip");
  weekStrip.innerHTML = "";
  const inicioSemana = new Date(ahora);
  inicioSemana.setDate(ahora.getDate() - ahora.getDay()); // domingo de esta semana
  for (let i = 0; i < 7; i++) {
    const d = new Date(inicioSemana);
    d.setDate(inicioSemana.getDate() + i);
    const chip = document.createElement("div");
    chip.className = "day-chip" + (d.toDateString() === hoyStr ? " today" : "");
    chip.innerHTML = `${DIAS_CORTOS[i]}<br>${d.getDate()}`;
    weekStrip.appendChild(chip);
  }

  // Listas de medicamentos
  // Aviso especial para medicamentos marcados como "especial: true"
  const avisoEspecial = document.getElementById("avisoEspecial");
  avisoEspecial.innerHTML = "";
  MEDICAMENTOS.filter(med => med.especial).forEach(med => {
    const esHoyEspecial = medAplicaHoy(med, ahora);
    const banner = document.createElement("div");
    banner.className = "aviso-especial " + (esHoyEspecial ? "si-toca" : "no-toca");
    banner.innerHTML = esHoyEspecial
      ? `<span class="icono">⚠️</span><span class="texto">Hoy SÍ toca ${med.nombre}<small>${med.dosis} · ${formatoHora12(med.hora)}</small></span>`
      : `<span class="icono">✅</span><span class="texto">Hoy NO toca ${med.nombre}<small>Es de uso semanal, revisa la lista de abajo</small></span>`;
    avisoEspecial.appendChild(banner);
  });

  const listHoy = document.getElementById("listHoy");
  const listNoHoy = document.getElementById("listNoHoy");
  listHoy.innerHTML = "";
  listNoHoy.innerHTML = "";

  const ordenados = [...MEDICAMENTOS].sort((a, b) => a.hora.localeCompare(b.hora));
  let hayHoy = false, hayNoHoy = false;
  let ultimaHoraHoy = null, ultimaHoraNoHoy = null;
  ordenados.forEach((med, i) => {
    const esHoy = medAplicaHoy(med, ahora);
    const fila = crearFila(med, esHoy, i);
    if (esHoy) {
      if (med.hora !== ultimaHoraHoy) { listHoy.appendChild(crearDivisorHora(med.hora)); ultimaHoraHoy = med.hora; }
      listHoy.appendChild(fila); hayHoy = true;
    } else {
      if (med.hora !== ultimaHoraNoHoy) { listNoHoy.appendChild(crearDivisorHora(med.hora)); ultimaHoraNoHoy = med.hora; }
      listNoHoy.appendChild(fila); hayNoHoy = true;
    }
  });
  if (!hayHoy) listHoy.innerHTML = `<div class="empty-note">No hay medicamentos programados para hoy.</div>`;
}

render();
setInterval(render, 30000); // se actualiza cada 30 segundos (hora y cambio de día)
</script>
</body>
</html>
